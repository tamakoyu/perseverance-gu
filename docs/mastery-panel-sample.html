<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掌握度面板样板</title>
<style>
  :root {
    --ink: #ecebe6; --ink2: #a8a9ad; --ink3: #818389;
    --rule: rgba(236,235,230,.12); --rule2: rgba(236,235,230,.24);
    --signal: #a9bfdf; --panel: rgba(17,18,21,.94);
    --num: "SF Pro Display", "Helvetica Neue", "PingFang SC", sans-serif;
    --t-fast: 120ms; --t-in: 280ms; --ease: cubic-bezier(.25,.46,.45,.94);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; background: #010103; color: var(--ink); font: 14px/1.5 -apple-system, "PingFang SC", sans-serif; }
  body { min-height: 100vh; padding: 28px 16px 60px; background:
    radial-gradient(1200px 600px at 70% -10%, rgba(120,130,150,.10), transparent 60%),
    radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1.5px 1.5px at 82% 32%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 46% 64%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1px 1px at 22% 82%, rgba(255,255,255,.4), transparent 60%),
    #010103; }
  .bar { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--rule2); border-radius: 8px; overflow: hidden; }
  .seg button { all: unset; cursor: pointer; padding: 6px 14px; font-size: 13px; color: var(--ink2); transition: color var(--t-fast), background var(--t-fast); }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: rgba(236,235,230,.1); color: var(--ink); }
  .seg button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: -3px; }
  .wrap { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  .panel { width: 380px; max-width: 100%; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 22px 22px 18px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.85); }
  .cap { text-align: center; font-size: 12px; color: var(--ink3); margin: 0 0 10px; }
  .kicker { font-size: 12px; color: var(--ink3); margin-bottom: 4px; }
  .title { font-size: 20px; font-weight: 500; margin: 0; }
  .headline { display: flex; align-items: baseline; justify-content: space-between; margin-top: 18px; }
  .big b { font: 200 44px var(--num); letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .big span { color: var(--ink3); font: 300 14px var(--num); margin-left: 4px; }
  .scale { position: relative; height: 9px; margin-top: 12px; border-bottom: 1px solid var(--rule2);
    background: repeating-linear-gradient(90deg, var(--rule2) 0 1px, transparent 1px 10%); background-size: 100% 4px; background-position: bottom; background-repeat: no-repeat; }
  .scale i { position: absolute; left: 0; bottom: -1px; height: 1px; background: var(--ink); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 20px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .stat { display: flex; flex-direction: column; padding: 10px 0 11px; min-width: 0; }
  .stat + .stat { padding-left: 14px; border-left: 1px solid var(--rule); }
  .stat span, .stat small { font-size: 12px; color: var(--ink3); }
  .stat b { font: 300 18px var(--num); font-variant-numeric: tabular-nums; }
  .sec { margin-top: 26px; }
  .h { font-size: 12px; color: var(--ink3); margin: 0 0 4px; font-weight: 400; }
  .note { font-size: 12px; color: var(--ink3); margin: 10px 0 0; line-height: 1.6; }

  /* 旧版：五档并排 */
  .tiers { display: grid; grid-template-columns: repeat(5,1fr); column-gap: 3px; margin-top: 10px; }
  .tier { display: grid; grid-template-rows: auto 1px auto; row-gap: 7px; color: var(--ink3); }
  .tier-name { font-size: 12px; } .tier-bar { height: 1px; background: var(--rule); position: relative; }
  .tier-bar i { position: absolute; left: 0; top: 0; height: 1px; background: var(--ink2); }
  .tier-cap { font: 12px var(--num); }
  .tier-now { color: var(--ink); } .tier-now .tier-bar i { background: var(--ink); }

  /* 新版：一个掌握度 + 一根进度条，点开按难度细分 */
  .m-row { display: flex; align-items: baseline; justify-content: space-between; }
  .m-row .lbl { font-size: 13px; color: var(--ink2); }
  .m-row b { font: 300 26px var(--num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .m-row b small { font-size: 14px; color: var(--ink3); margin-left: 1px; }
  .track { height: 3px; border-radius: 2px; background: var(--rule); margin-top: 10px; overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 2px; background: var(--ink); transform-origin: left; transition: transform var(--t-in) var(--ease); }
  .m-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 12px; }
  .m-foot span { font-size: 12px; color: var(--ink3); }
  .more { all: unset; cursor: pointer; font-size: 12px; color: var(--ink2); display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; min-height: 24px; transition: color var(--t-fast); }
  .more:hover { color: var(--ink); }
  .more:active { transform: translateY(1px); }
  .more:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
  .more svg { width: 10px; height: 10px; transition: transform 200ms var(--ease); }
  .more[aria-expanded="true"] svg { transform: rotate(180deg); }
  .detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-in) var(--ease); }
  .detail.on { grid-template-rows: 1fr; }
  .detail > div { overflow: hidden; }
  .rows { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); display: grid; row-gap: 12px; }
  .r { display: grid; grid-template-columns: 56px 1fr 40px; align-items: center; column-gap: 14px; font-size: 13px; color: var(--ink2); }
  .r .nm { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .r .nm em { font-style: normal; font-size: 11px; color: var(--ink3); }
  .r .tk { height: 2px; border-radius: 1px; background: var(--rule); overflow: hidden; }
  .r .tk i { display: block; height: 100%; background: var(--ink3); }
  .r .pc { text-align: right; font: 13px var(--num); font-variant-numeric: tabular-nums; color: var(--ink3); }
  .r.now { color: var(--ink); } .r.now .tk i { background: var(--ink); } .r.now .pc { color: var(--ink); }
  .r.now .nm em { color: var(--ink2); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="seg" role="group" aria-label="版本">
      <button aria-pressed="false" data-v="old">现在</button>
      <button aria-pressed="true" data-v="new">改后</button>
    </div>
    <div class="seg" role="group" aria-label="状态">
      <button aria-pressed="true" data-s="has">有记录</button>
      <button aria-pressed="false" data-s="none">没记录</button>
    </div>
  </div>
  <div class="wrap"><div><p class="cap" id="cap"></p><div class="panel" id="panel"></div></div></div>

<script>
const DATA = {
  has: { kicker: "高数 / 函数、极限、连续", name: "无穷小与无穷大", score: 1.4, points: 2.6, m: .54, n: 11, R: "100%", S: "稳定 8 天", real: 20,
    p: [.94, .84, .67, .42, .21], mix: [0, .56, .41, .04, 0], top: 3, next: 3 },
  none: { kicker: "高数 / 一元函数微分学", name: "单调性、极值与最值", score: 0, points: 3.8, m: 0, n: 0, R: "—", S: "—", real: 23,
    p: [0, 0, 0, 0, 0], mix: [0, .23, .38, .27, .12], top: 0, next: 1 },
};
const NAMES = ["基础", "简单", "中档", "较难", "压轴"];
let v = "new", st = "has", open = false;
const $ = (s, r = document) => r.querySelector(s);
const pct = (x) => `${Math.round(x * 100)}`;
function head(d) {
  return `<div class="kicker">${d.kicker}</div><h3 class="title">${d.name}</h3>
    <div class="headline"><div class="big"><b>${d.score.toFixed(1)}</b><span>/ ${d.points.toFixed(1)} 分</span></div></div>
    <div class="scale"><i style="width:${d.score / d.points * 100}%"></i></div>`;
}
function oldPanel(d) {
  return head(d) + `<div class="stats">
      <div class="stat"><span>掌握度</span><b>${pct(d.m)}%</b><small>${d.n} 条记录</small></div>
      <div class="stat"><span>记忆保持</span><b>${d.R}</b><small>${d.S}</small></div>
      <div class="stat"><span>历年真题</span><b>${d.real}</b><small>道</small></div></div>
    <section class="sec"><h4 class="h">各难度的把握</h4><div class="tiers">${NAMES.map((n, i) => `
      <div class="tier${d.n && i + 1 === d.next ? " tier-now" : ""}"><span class="tier-name">${n}${d.top > i ? " ✓" : ""}</span>
      <span class="tier-bar"><i style="width:${d.p[i] * 100}%"></i></span>
      <small class="tier-cap">${d.n ? `做对 ${pct(d.p[i])}%` : "—"} · 真题 ${pct(d.mix[i])}%</small></div>`).join("")}</div>
    ${d.n ? `<p class="note">按现在的水平，各档题的预计做对率；高亮的是建议难度（预计做对率低于 75% 的最低一档），练这一档最能涨分。掌握度误差约 ±16%。</p>` : ""}</section>`;
}
function newPanel(d) {
  const share = d.mix.map((x, i) => [NAMES[i], x]).filter(([, x]) => x >= .1).map(([n, x]) => `${n} ${pct(x)}%`).join("、");
  return head(d) + `<div class="stats">
      <div class="stat"><span>记忆保持</span><b>${d.R}</b><small>${d.S}</small></div>
      <div class="stat"><span>作答记录</span><b>${d.n}</b><small>条</small></div>
      <div class="stat"><span>历年真题</span><b>${d.real}</b><small>道</small></div></div>
    <section class="sec">
      <div class="m-row"><span class="lbl">掌握度</span><b>${pct(d.m)}<small>%</small></b></div>
      <div class="track" role="progressbar" aria-label="掌握度" aria-valuenow="${pct(d.m)}" aria-valuemin="0" aria-valuemax="100"><i style="transform:scaleX(${d.m})"></i></div>
      <div class="m-foot"><span>${d.n ? `建议练${NAMES[d.next - 1]}题` : "还没有作答记录"}</span>
        ${d.n ? `<button class="more" aria-expanded="${open}" aria-controls="dt">按难度看<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3.5 5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>` : ""}</div>
      ${d.n ? `<div class="detail${open ? " on" : ""}" id="dt"><div><div class="rows">${NAMES.map((n, i) => `
        <div class="r${i + 1 === d.next ? " now" : ""}"><span class="nm">${n}${d.top > i ? "<em>✓</em>" : ""}</span>
          <span class="tk"><i style="width:${d.p[i] * 100}%"></i></span><span class="pc">${pct(d.p[i])}%</span></div>`).join("")}</div>
        <p class="note">每档是现在做这一档题的预计做对率，亮的一行是建议练的难度。这个考点的真题里：${share}。</p></div></div>` : ""}
    </section>`;
}
function render() {
  const d = DATA[st];
  $("#cap").textContent = v === "old" ? "现在的样子" : "改后：一个掌握度 + 进度条，点「按难度看」展开";
  $("#panel").innerHTML = v === "old" ? oldPanel(d) : newPanel(d);
  const b = $(".more");
  if (b) b.onclick = () => { open = !open; b.setAttribute("aria-expanded", open); $("#dt").classList.toggle("on", open); };
}
document.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => { v = b.dataset.v; document.querySelectorAll("[data-v]").forEach((x) => x.setAttribute("aria-pressed", x === b)); render(); });
document.querySelectorAll("[data-s]").forEach((b) => b.onclick = () => { st = b.dataset.s; document.querySelectorAll("[data-s]").forEach((x) => x.setAttribute("aria-pressed", x === b)); render(); });
render();
</script>
</body>
</html>
